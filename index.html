<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixio - Sub-Dealer Profile</title>
<link href="assets/vendor/bootstrap-select/dist/css/bootstrap-select.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/bootstrap-touchspin/dist/jquery.bootstrap-touchspin.min.css">
<link rel="stylesheet" href="assets/vendor/imageuplodify/imageuploadify.min.css">
<link rel="stylesheet" href="assets/vendor/swiper/swiper-bundle.min.css">
<link rel="stylesheet" type="text/css" href="assets/css/style.css">
</head>
<body>
<div class="page-wrapper">
    <main class="page-content space-top p-b80">
        <div class="container">
            <div class="edit-profile">
                <div class="profile-image">
                    <div class="avatar-upload">
                        <div class="avatar-preview">
                            <div id="imagePreview" style="background-image: url(assets/images/avatar/1.png);"></div>
                            <div class="change-btn">
                                <input type='file' class="form-control d-none"  id="imageUpload" accept=".png, .jpg, .jpeg">
                                <label for="imageUpload"><i class="fi fi-rr-pencil"></i></label>
                            </div>
                        </div>
                    </div>  
                </div>

                <div class="mb-3">
                    <label class="form-label" for="name">Full Name</label>
                    <input type="text" id="name" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="phone">Mobile Number</label>
                    <input type="tel" id="phone" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <input type="email" id="email" class="form-control">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="address">Location</label>
                    <input type="text" id="address" class="form-control" placeholder="Street, Area, City">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="pincode">Pincode</label>
                    <input type="text" id="pincode" class="form-control" maxlength="6" placeholder="Pincode">
                </div>
            </div>
        </div>
    </main>

    <div class="footer-fixed-btn bottom-0 bg-white">
        <a href="javascript:void(0);" id="updateProfileBtn" class="btn btn-lg btn-thin rounded-xl btn-primary w-100">Update Profile</a>
    </div>  
</div>

<script src="assets/js/jquery.js"></script>
<script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="assets/vendor/swiper/swiper-bundle.min.js"></script>
<script src="assets/vendor/imageuplodify/imageuploadify.js"></script>
<script src="assets/vendor/bootstrap-touchspin/dist/jquery.bootstrap-touchspin.min.js"></script>

<script>
    function readURL(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                $('#imagePreview').css('background-image', 'url('+e.target.result +')');
                $('#imagePreview').hide();
                $('#imagePreview').fadeIn(650);
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
    $("#imageUpload").change(function() { readURL(this); });
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

// Firebase config
const firebaseConfig = {
    apiKey: "AIzaSyAHaF5_yrUDx9T92N0lHdJFAUj0fAfAkwE",
    authDomain: "buildup-702d7.firebaseapp.com",
    projectId: "buildup-702d7",
    storageBucket: "buildup-702d7.firebasestorage.app",
    messagingSenderId: "212714636324",
    appId: "1:212714636324:web:bba5c1cd7d7735ff1884b1",
    measurementId: "G-4X71M0FF6W"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

// Ensure user is logged in anonymously
let currentUser = null;
signInAnonymously(auth)
    .then((userCredential) => { currentUser = userCredential.user; })
    .catch((error) => { alert("Auth error: " + error.message); });

// Get GPS coordinates
function getLocation() {
    return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
            reject("Geolocation not supported.");
            return;
        }
        navigator.geolocation.getCurrentPosition(
            (position) => {
                resolve({
                    latitude: position.coords.latitude,
                    longitude: position.coords.longitude
                });
            },
            (error) => { reject("GPS error: " + error.message); },
            { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
        );
    });
}

// Update profile
document.getElementById("updateProfileBtn").onclick = async function () {
    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const email = document.getElementById("email").value.trim();
    const address = document.getElementById("address").value.trim();
    const pincode = document.getElementById("pincode").value.trim();

    if (!currentUser) { alert("User not authenticated."); return; }

    let latitude = null, longitude = null;
    try { 
        const coords = await getLocation(); 
        latitude = coords.latitude;
        longitude = coords.longitude;
    } catch(err) { alert(err); return; }

    try {
        await setDoc(doc(db, "sub-dealer", currentUser.uid, "details", "profile"), {
            name, phone, email, address, pincode, latitude, longitude, updatedAt: new Date().toISOString()
        });
        alert("Profile updated successfully!");
        window.location.href = "profile.html";
    } catch(err) {
        alert("Failed to update profile: " + err.message);
    }
};
</script>
</body>
</html>
